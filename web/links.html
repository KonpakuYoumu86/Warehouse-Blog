<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Warehouse-Blog — Friendly Link</title>
  <meta name="description" content="Friendly links and partner sites.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/img/background.png" as="image" fetchpriority="high">
  <link rel="preload" href="./assets/img/default-avatar.svg" as="image">
  <link rel="stylesheet" href="./assets/css/styles.css?v=20260620-nginx-dual">
  <script src="./assets/js/config.js?v=20260620-nginx-dual" defer></script>
  <script src="./assets/js/app.js?v=20260620-nginx-dual" defer></script>
</head>
<body data-current-lang="en" data-page="links" data-current-path="links.html">
  <div class="modal-root" data-modal-root></div>
  <div class="toast-stack" data-toast-stack aria-live="polite" aria-atomic="true"></div>

  <header class="topbar">
    <div class="topbar__left">
      <div class="language-box" data-language-box>
        <button class="language-box__button" type="button" aria-expanded="false" aria-controls="lang-menu" data-language-button>
          <span>Language</span>
          <span class="language-box__caret" aria-hidden="true">⌄</span>
        </button>
        <div class="language-box__menu" id="lang-menu" data-language-menu>
          <button class="language-box__item is-active" type="button" data-language-item data-target="links.html">English</button>
          <button class="language-box__item " type="button" data-language-item data-target="links.zh-CN.html">Simplified Chinese</button>
        </div>
      </div>
      <button class="topbar__button topbar__button--light" type="button" data-login-toggle>Log In</button>
      <button class="topbar__button topbar__button--light" type="button" data-board-button>Message Board</button>
      <button class="topbar__button topbar__button--light" type="button" data-links-button>Friendly Link</button>
      <button class="topbar__button topbar__button--light" type="button" data-about-button>About</button>
    </div>

    <div class="topbar__right">
      <button class="icon-button" type="button" data-search-open aria-label="Search user by UID">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 0 4.06 11.58l4.43 4.43 1.41-1.41-4.43-4.43A6.5 6.5 0 0 0 10.5 4Zm0 2a4.5 4.5 0 1 1 0 9a4.5 4.5 0 0 1 0-9Z" fill="currentColor"/></svg>
      </button>
      <button class="topbar__button topbar__button--green" type="button" data-panel-button>My Panel</button>
      <button class="avatar-button" type="button" data-avatar-trigger aria-label="avatar button">
        <img src="./assets/img/default-avatar.svg" alt="" data-topbar-avatar>
      </button>
      <input class="sr-only" type="file" accept="image/*" data-avatar-input>
    </div>
  </header>

  <main class="page">
    <section class="hero-banner hero-banner--article">
      <img class="hero-banner__bg" src="./assets/img/background.png" alt="" width="2048" height="1154" fetchpriority="high">
      <div class="hero-banner__veil" aria-hidden="true"></div>
      <section class="article-section article-section--links">
        <div class="article article--links">
          <div class="links-panel__head">
            <h1>Friendly Link</h1>
            <a class="links-random-button" href="https://mikufy.dpdns.org/" target="_blank" rel="noopener noreferrer">Random link</a>
          </div>
          <div class="info">
            <span class="date">Featured site</span>
          </div>
          <div class="content">
            <p>Friendly links are listed here.</p>
            <div class="links-grid" aria-label="Friendly links">
              <a class="friendly-link-card" href="https://mikufy.dpdns.org/" target="_blank" rel="noopener noreferrer">
                <img class="friendly-link-card__icon" src="./assets/img/Mikufy.png" alt="" width="56" height="56">
                <span class="friendly-link-card__body">
                  <span class="friendly-link-card__name">Mikufy</span>
                  <span class="friendly-link-card__url">mikufy.dpdns.org</span>
                  <span class="friendly-link-card__desc">Author: LinusTrevian</span>
                </span>
                <span class="friendly-link-card__arrow" aria-hidden="true">›</span>
              </a>
            </div>
          </div>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
