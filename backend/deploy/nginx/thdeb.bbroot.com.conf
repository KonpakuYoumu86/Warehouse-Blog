server {
    listen 80;
    listen [::]:80;
    server_name thdeb.bbroot.com;

    root /opt/warehouse-blog/web;
    index index.html;

    client_max_body_size 3m;

    location = /board.html { return 301 /board/; }
    location = /board.zh-CN.html { return 301 /board.zh-CN/; }
    location = /panel.html { return 301 /panel/; }
    location = /panel.zh-CN.html { return 301 /panel.zh-CN/; }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
